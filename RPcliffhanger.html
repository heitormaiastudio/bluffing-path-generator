<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrieving Path: Cliffhanger Edition</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .header { text-align: center; margin-bottom: 20px; width: 100%; }
        .logo-school { height: 110px; margin-bottom: 15px; }
        .logo-game { max-width: 280px; display: block; margin: 0 auto; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 90%; max-width: 450px; text-align: center; min-height: 380px; }
        
        /* Menu grid para as 7 categorias */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .menu-grid button:last-child { grid-column: span 2; } 
        
        button { padding: 15px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-who { background-color: #7d6fb3; }
        .btn-what { background-color: #5d4a99; }
        .btn-where { background-color: #4a3b80; }
        .btn-when { background-color: #3a2d66; }
        .btn-why { background-color: #2a1f4d; }
        .btn-which { background-color: #1a1233; }
        .btn-how { background-color: #0f0a21; }
        
        .question-box { display: none; }
        .question-text { font-size: 19px; margin: 25px 0; font-weight: 600; color: #2a1f4d; line-height: 1.4; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        
        .action-area { margin-top: 20px; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .btn-reveal { background-color: #4caf50; font-size: 12px; }
        .challenge-container { display: flex; gap: 5px; }
        .btn-challenge { background-color: #ff9800; font-size: 12px; flex-grow: 1; }
        
        .info-btn { 
            background-color: #ffd54f; 
            color: #827717;
            border-radius: 8px; 
            width: 45px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px; 
            font-weight: bold;
            cursor: help;
            border: 2px solid #fbc02d;
        }

        .answer-text { display: none; margin-top: 20px; padding: 15px; border-radius: 8px; font-style: italic; text-align: left; animation: fadeIn 0.4s; line-height: 1.5; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn-back { background-color: #888; width: 100%; margin-top: 20px; }
        .footer { margin-top: 30px; text-align: center; color: #666; font-size: 12px; }
        .logo-maia { height: 32px; margin-top: 5px; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo-school.png" alt="School" class="logo-school">
        <img src="logo-cliffhanger.png" alt="Cliffhanger" class="logo-game">
    </div>

    <div class="container">
        <div id="menu" class="menu-grid">
            <button class="btn-who" onclick="showQuestion('who')">WHO</button>
            <button class="btn-what" onclick="showQuestion('what')">WHAT</button>
            <button class="btn-where" onclick="showQuestion('where')">WHERE</button>
            <button class="btn-when" onclick="showQuestion('when')">WHEN</button>
            <button class="btn-why" onclick="showQuestion('why')">WHY</button>
            <button class="btn-which" onclick="showQuestion('which')">WHICH</button>
            <button class="btn-how" onclick="showQuestion('how')">HOW</button>
        </div>

        <div id="question-display" class="question-box">
            <p id="cat-label" style="color: #888; font-size: 11px; text-transform: uppercase; margin: 0; font-weight: bold;"></p>
            <div id="question-content" class="question-text"></div>
            
            <div class="action-area">
                <div id="buttons-area" class="action-grid">
                    <button class="btn-reveal" onclick="reveal('normal')">REVEAL TRUTH</button>
                    
                    <div id="challenge-wrapper" class="challenge-container">
                        <button id="challenge-btn" class="btn-challenge" onclick="reveal('challenge')">CHALLENGE</button>
                        <div id="hint-icon" class="info-btn" title="" onclick="showMobileHint()">?</div>
                    </div>
                </div>
            </div>

            <div id="answer-content" class="answer-text"></div>
            <button class="btn-back" onclick="goBack()">BACK</button>
        </div>
    </div>

    <div class="footer">
        <div>Designed and offered by:</div>
        <img src="logo-maia.png" alt="Maia Studio" class="logo-maia">
    </div>

    <script>
        const questions = {
            who: [
                { q: "Who wanted Tim to go on an adventure holiday?", a: "His dad wanted him to go on an adventure holiday.", sc: "Challenge: Use the verb 'encourage' or mention his father's intention.", ac: "Evidence: His dad strongly encouraged him because he wanted Tim to be more active." },
                { q: "Who was very worried about letting her child go on the adventure?", a: "Tim’s mom was very worried about letting him go.", sc: "", ac: "" },
                { q: "Who was the best at sports among Giles, Biscuit and Tim?", a: "Giles was the best and most competitive at sports.", sc: "", ac: "" },
                { q: "Who was the first to go abseiling?", a: "Biscuit went down the cliff first during the abseiling activity.", sc: "", ac: "" },
                { q: "Who was always there to encourage and help Tim and the others?", a: "Jake the instructor was always there to support and guide them.", sc: "Challenge: Use the adjective 'supportive' or 'reliable'.", ac: "Evidence: Jake was a highly supportive instructor who never left anyone behind." },
                { q: "Who rescued Teresa, the troll, from the water?", a: "Tim and Biscuit worked together to rescue Teresa from the water.", sc: "", ac: "" }
            ],
            what: [
                { q: "What did Tim like besides watching the telly?", a: "Tim liked drawing, reading and making complex puzzles.", sc: "", ac: "" },
                { q: "What did Giles hit Tim with when they first met in the room?", a: "Giles aggressively hit Tim with his tennis racquet.", sc: "Challenge: Use the verb 'struck' or describe Giles' mean attitude.", ac: "Evidence: Giles struck Tim with his racquet, showing his mean character right away." },
                { q: "What was the P.S. in his first postcard?", a: "The P.S. in his postcard stated that he had found a new friend named Biscuit.", sc: "", ac: "" },
                { q: "What was Tim not afraid of?", a: "Tim was surprisingly not afraid of handling worms and mud.", sc: "", ac: "" },
                { q: "What was Tim’s strategy to throw water into the Baby Tiger bin?", a: "He strategically asked his team to use the drainpipe as a long hose.", sc: "Challenge: Use the noun 'strategy' or 'brilliant idea'.", ac: "Evidence: Tim developed a brilliant strategy by turning the drainpipe into a functional hose." },
                { q: "What was the prize for the winning team?", a: "The prize for the overall winning team was six baby stuffed tigers.", sc: "", ac: "" }
            ],
            where: [
                { q: "Where did Tim’s father want him to go?", a: "His father wanted him to go to the Adventure Centre for the holidays.", sc: "", ac: "" },
                { q: "Where did he go to cry after playing Triangle?", a: "Tim went directly to the toilet to hide and cry.", sc: "Challenge: Use 'miserable' or 'overwhelmed' to describe his feelings.", ac: "Evidence: He felt completely miserable and overwhelmed after playing Triangle." },
                { q: "Where did Giles and Kelly's canoe tip over?", a: "Their canoe tipped over completely in the deep water.", sc: "", ac: "" },
                { q: "Where did a Cheetah bump into Tim, making him spill his water?", a: "A boy from the Cheetahs bumped into him at the very beginning of the Crazy Bucket Race.", sc: "", ac: "" },
                { q: "Where did Tim hide his postcard so Giles wouldn't see it?", a: "Tim safely hid his postcard deep under his mattress.", sc: "", ac: "" },
                { q: "Where did the children sleep during their stay at the Adventure Centre?", a: "The children slept in bunk beds located inside their respective team rooms.", sc: "", ac: "" }
            ],
            why: [
                { q: "Why did his father want Tim to go to the Adventure Centre?", a: "His father wanted him to try physical activities instead of spending time watching TV, drawing, and reading.", sc: "Challenge: Contrast Tim's quiet hobbies with his father's expectations.", ac: "Evidence: His father disapproved of quiet hobbies like reading and pushed for physical outdoor adventures." },
                { q: "Why did he say “You can't always trust your parents”?", a: "He said that because he wrote a letter begging them to pick him up, but they did not come.", sc: "", ac: "" },
                { q: "Why did Giles and Kelly not win the canoeing competition, even though they were very close to doing so?", a: "They lost because Teresa the Troll accidentally fell into their boat and tipped it over.", sc: "", ac: "" },
                { q: "Why did Tim want to take Water Bear to the adventure centre?", a: "He wanted to take Water Bear because it was his favorite teddy bear and provided emotional comfort.", sc: "", ac: "" },
                { q: "Why did Tim feel terrified when he looked down from the cliff?", a: "Tim felt terrified because he suffered from a massive fear of heights and abseiling.", sc: "Challenge: Use the term 'paralyzing fear' or 'heights'.", ac: "Evidence: Looking down the steep cliff triggered a paralyzing fear of heights within him." },
                { q: "Why did Biscuit get stuck during the abseiling activity?", a: "Biscuit got stuck because he was a bit heavy and became too scared to move halfway down the drop.", sc: "" , ac: "" }
            ],
            when: [
                { q: "When did Tim realize it would have been ok to have his teddy bear with him?", a: "He realized it at bedtime when he saw the other two boys in his room sleeping with their own teddy bears.", sc: "Challenge: Describe the setting of this realization.", ac: "Evidence: He realized his mistake during the first night when the room became quiet at bedtime." },
                { q: "When did they play Triangle?", a: "They played the competitive game of Triangle on the very first day of the camp.", sc: "", ac: "" },
                { q: "When did Tim's dad give him the postcards to write home?", a: "His dad gave him the set of postcards right before he departed for the adventure camp.", sc: "", ac: "" },
                { q: "When did the Tigers realize they could actually win the Crazy Bucket Race?", a: "They realized they could win when Tim formulated the clever plan to use the drainpipes.", sc: "Challenge: Use the adverb 'instantly' or mention Tim's leadership.", ac: "Evidence: The team instantly felt a surge of hope when Tim took charge and solved the problem." },
                { q: "When did Giles finally stop being mean and start acting like a good teammate to Tim?", a: "Giles changed his behavior after Tim successfully helped the Tigers win the final race.", sc: "", ac: "" },
                { q: "When did the children receive their stuffed tiger prizes?", a: "The children received them at the very end of the holiday during the official closing award ceremony.", sc: "", ac: "" }
            ],
            which: [
                { q: "Which boy was called “Biscuits”?", a: "Tim's kind new friend was the one called Biscuits.", sc: "", ac: "" },
                { q: "Which team won the final competition?", a: "The Tigers successfully won the final grand competition.", sc: "Challenge: Mention their collective effort or triumph.", ac: "Evidence: Against all odds, the Tigers triumphed and secured the first-place victory." },
                { q: "Which piece of safety equipment did Tim bring from home?", a: "Tim brought a protective riding helmet from his home.", sc: "", ac: "" },
                { q: "Which boy in the Tigers team was the most athletic?", a: "Giles was clearly the most athletic and energetic boy in the Tigers team.", sc: "", ac: "" },
                { q: "Which activity did Tim actually enjoy because it involved mud and worms instead of heights?", a: "Tim actually thoroughly enjoyed participating in the dark night walk.", sc: "", ac: "" },
                { q: "Which character was the instructor in charge of the Tigers team?", a: "Jake was the professional instructor assigned to lead the Tigers team.", sc: "", ac: "" }
            ],
            how: [
                { q: "What was Tim’s bear called?", a: "His beloved teddy bear was formally called Water Bear.", sc: "", ac: "" },
                { q: "What was his team called at the Adventure Centre?", a: "His assigned group was proudly called 'The Tigers'.", sc: "", ac: "" },
                { q: "How did he feel about playing?", a: "He initially felt completely useless and incompetent compared to the athletic boys.", sc: "Challenge: Use the adjectives 'worthless' or 'incompetent'.", ac: "Evidence: The aggressive nature of the games made him feel entirely incompetent and out of place." },
                { q: "How did Laura help Teresa, the troll?", a: "Laura helped by gently combing and brushing her messy hair.", sc: "", ac: "" },
                { q: "How did Tim find out how to use the drainpipes wisely to put water in the Baby Tiger bin?", a: "Tim figured it out by instructing his teammates to tightly connect the pipes to act as a long continuous hose.", sc: "", ac: "" },
                { q: "What did Tim name his tiger?", a: "Tim proudly named his newly won stuffed tiger 'Biscuits'.", sc: "", ac: "" }
            ]
        };

        let currentQ = null;
        let lastQuestionText = ""; 

        function showQuestion(cat) {
            const list = questions[cat];
            let nextQ;
            do {
                nextQ = list[Math.floor(Math.random() * list.length)];
            } while (nextQ.q === lastQuestionText && list.length > 1);

            currentQ = nextQ;
            lastQuestionText = currentQ.q; 
            
            document.getElementById('menu').style.display = 'none';
            document.getElementById('question-display').style.display = 'block';
            document.getElementById('cat-label').innerText = cat;
            document.getElementById('question-content').innerText = currentQ.q;
            document.getElementById('answer-content').style.display = 'none';
            
            const challengeWrapper = document.getElementById('challenge-wrapper');
            const hIcon = document.getElementById('hint-icon');
            const btnGrid = document.getElementById('buttons-area');

            if (currentQ.sc && currentQ.sc !== "") {
                challengeWrapper.style.display = 'flex';
                hIcon.title = currentQ.sc; 
                btnGrid.style.gridTemplateColumns = '1fr 1fr';
            } else {
                challengeWrapper.style.display = 'none';
                btnGrid.style.gridTemplateColumns = '1fr';
            }
        }

        function showMobileHint() {
            if (currentQ.sc) {
                alert(currentQ.sc);
            }
        }

        function reveal(type) {
            const box = document.getElementById('answer-content');
            box.style.display = 'block';
            if (type === 'challenge') {
                box.innerHTML = "<strong>Challenge Evidence:</strong><br>" + currentQ.ac;
                box.style.backgroundColor = "#fff3e0";
                box.style.borderLeft = "5px solid #ff9800";
                box.style.color = "#e65100";
            } else {
                box.innerHTML = "<strong>Standard Truth:</strong><br>" + currentQ.a;
                box.style.backgroundColor = "#e8f5e9";
                box.style.borderLeft = "5px solid #4caf50";
                box.style.color = "#2e7d32";
            }
        }

        function goBack() {
            document.getElementById('menu').style.display = 'grid';
            document.getElementById('question-display').style.display = 'none';
        }
    </script>
</body>
</html>
