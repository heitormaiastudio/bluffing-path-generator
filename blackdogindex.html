<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrieving Path: Black Dog Edition</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .header { text-align: center; margin-bottom: 20px; width: 100%; }
        .logo-school { height: 110px; margin-bottom: 15px; }
        .logo-game { max-width: 280px; display: block; margin: 0 auto; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 90%; max-width: 450px; text-align: center; min-height: 380px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { padding: 15px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-who { background-color: #7d6fb3; }
        .btn-what { background-color: #5d4a99; }
        .btn-where { background-color: #4a3b80; }
        .btn-when { background-color: #3a2d66; }
        .btn-why { background-color: #2a1f4d; }
        .btn-which { background-color: #1a1233; }
        .question-box { display: none; }
        .question-text { font-size: 19px; margin: 25px 0; font-weight: 600; color: #2a1f4d; line-height: 1.4; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        
        .action-area { margin-top: 20px; }
        .action-grid { display: flex; flex-direction: column; gap: 10px; }
        
        .btn-reveal { background-color: #4caf50; font-size: 14px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        
        /* Container flexível para alinhar o botão de desafio e a interrogação de dica */
        .challenge-row { display: flex; gap: 8px; width: 100%; }
        .btn-challenge { background-color: #ff9800; font-size: 14px; display: flex; flex-direction: column; align-items: center; flex-grow: 1; border-radius: 8px; }
        .btn-reveal small, .btn-challenge small { font-size: 11px; font-weight: normal; margin-top: 4px; opacity: 0.9; }

        /* Estilo do Botão de Dica (?) */
        .btn-hint { 
            background-color: #ffd54f; 
            color: #827717; 
            border: 2px solid #fbc02d; 
            font-size: 20px; 
            font-weight: bold; 
            width: 50px; 
            border-radius: 8px; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .btn-hint:active { transform: scale(0.95); }

        .answer-text { display: none; margin-top: 20px; padding: 15px; border-radius: 8px; font-style: italic; text-align: left; animation: fadeIn 0.4s; line-height: 1.5; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn-back { background-color: #888; width: 100%; margin-top: 20px; }
        .footer { margin-top: 30px; text-align: center; color: #666; font-size: 12px; }
        .logo-maia { height: 32px; margin-top: 5px; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo-school.png" alt="School" class="logo-school">
        <img src="logo-rp.png" alt="Retrieving Path" class="logo-game">
    </div>

    <div class="container">
        <div id="menu" class="menu-grid">
            <button class="btn-who" onclick="showQuestion('who')">WHO</button>
            <button class="btn-what" onclick="showQuestion('what')">WHAT</button>
            <button class="btn-where" onclick="showQuestion('where')">WHERE</button>
            <button class="btn-when" onclick="showQuestion('when')">WHEN</button>
            <button class="btn-why" onclick="showQuestion('why')">WHY</button>
            <button class="btn-which" onclick="showQuestion('which')">WHICH</button>
        </div>

        <div id="question-display" class="question-box">
            <p id="cat-label" style="color: #888; font-size: 11px; text-transform: uppercase; margin: 0; font-weight: bold;"></p>
            <div id="question-content" class="question-text"></div>
            
            <div class="action-area" id="action-area">
                <div id="buttons-area" class="action-grid">
                    
                    <button class="btn-reveal" onclick="reveal('acceptable')">
                        ACCEPTABLE TRUTH <small>(Move what you rolled)</small>
                    </button>
                    
                    <!-- Linha do desafio com o Scaffold Gramatical (?) integrado ao lado -->
                    <div class="challenge-row">
                        <button class="btn-challenge" onclick="reveal('standard')">
                            STANDARD TRUTH <small>(Move what you rolled + 1 Bonus!)</small>
                        </button>
                        <button class="btn-hint" onclick="showScaffold()" title="Get grammar clues">?</button>
                    </div>

                </div>
            </div>

            <div id="answer-content" class="answer-text"></div>
            <button class="btn-back" onclick="goBack()">BACK</button>
        </div>
    </div>

    <div class="footer">
        <div>Designed and offered by:</div>
        <img src="logo-maia.png" alt="Maia Studio" class="logo-maia">
    </div>

    <script>
        // Mantive seu banco de dados estruturado e limpo
        const questions = {
            who: [
                { q: "Who was the first person to spot the Black Dog?", acceptable: "Mr. Hope spotted the dog first.", standard: "Early in the morning, Mr. Hope was the first person to spot the terrifying creature.", hints: "Early in the morning / terrifying" },
                { q: "Who described the dog's nose as big as a fridge?", acceptable: "Mrs. Hope described it like that.", standard: "Gasping in shock, Mrs. Hope described the beast's nose as being as big as a fridge.", hints: "Gasping in shock / beast's" },
                { q: "Who was the only character not affected by irrational fear?", acceptable: "Small was the only one who was not afraid.", standard: "Unlike her terrified family, Small was the only character who did not feel irrational fear.", hints: "Unlike her terrified family / irrational" },
                { q: "Who hid under the duvet in the bedroom?", acceptable: "Mr. Hope and Mrs. Hope hid under the duvet.", standard: "Underneath the heavy duvet, Mr. and Mrs. Hope hid with absolute terror.", hints: "Underneath the heavy duvet / absolute terror" },
                { q: "Who followed Small through the playground?", acceptable: "The Black Dog followed her.", standard: "As they ran through the playground, the colossal Black Dog followed Small.", hints: "As they ran through / colossal" }
            ],
            what: [
                { q: "What did the family think the dog looked like at first?", acceptable: "They thought it was a giant monster.", standard: "Due to their morbid imagination, the family thought the dog was a giant, terrifying monster.", hints: "Due to / morbid / terrifying" },
                { q: "What did Small play with the dog outside?", acceptable: "She played a game of chase.", standard: "Without any hesitation, Small played an energetic game of chase with the beast.", hints: "Without any hesitation / energetic / beast" },
                { q: "What did Mr. Hope do after spotting the dog?", acceptable: "He called the police.", standard: "Trembling with fear, Mr. Hope called the police to report a giant animal.", hints: "Trembling with fear / report" },
                { q: "What happened to the dog's size when Small ignored the fear?", acceptable: "The dog began to shrink.", standard: "Since Small completely ignored the family's fear, the dog began to shrink with every step.", hints: "Since / completely ignored / shrink" },
                { q: "What was the weather like on that morning?", acceptable: "It was cold and snowing.", standard: "On that particular morning, the weather was freezing cold and covered in thick snow.", hints: "On that particular morning / freezing / thick snow" }
            ],
            where: [
                { q: "Where did Mr. Hope first see the dog?", acceptable: "He saw it outside the window.", standard: "Outside the frosted window, Mr. Hope saw the colossal dog in the snow.", hints: "Outside the frosted window / colossal" },
                { q: "Where did Maurice hide from the dog?", acceptable: "Maurice hid behind the curtains.", standard: "Behind the heavy living room curtains, Maurice cowered in complete terror.", hints: "Behind the heavy... / cowered in complete terror" },
                { q: "Where did Adeline hide?", acceptable: "Adeline hid under the table.", standard: "Underneath the wooden kitchen table, Adeline tried to make herself invisible.", hints: "Underneath the wooden... / invisible" },
                { q: "Where did the chase end?", acceptable: "It ended at the cat flap.", standard: "Eventually, the exhausting chase ended right in front of the tiny cat flap.", hints: "Eventually / exhausting / tiny cat flap" },
                { q: "Where did the family feel safe together?", acceptable: "They felt safe inside the kitchen.", standard: "Inside the warm kitchen, the family finally felt safe and secure together.", hints: "Inside the warm kitchen / safe and secure" }
            ],
            when: [
                { q: "When did the dog appear?", acceptable: "It appeared early in the morning.", standard: "During a gloomy and snowy dawn, the enormous Black Dog mysteriously appeared.", hints: "During a gloomy and snowy dawn / mysteriously" },
                { q: "When did the dog finally shrink?", acceptable: "It shrunk after Small showed she wasn't afraid.", standard: "The dog finally shrunk into a puppy when Small confidently proved she was not afraid.", hints: "confidently proved" },
                { q: "When did the family stop hiding?", acceptable: "They stopped hiding when the dog was small.", standard: "The family only stopped hiding when they realized the creature was now a tiny, harmless puppy.", hints: "realized / tiny, harmless" },
                { q: "When did the story end?", acceptable: "It ended when they sat by the fire.", standard: "After they overcame their irrational fear, the story ended with the family sitting cozy by the fire.", hints: "After they overcame... / cozy" },
                { q: "When did Mrs. Hope see the dog?", acceptable: "She saw it after her husband called her.", standard: "Immediately after Mr. Hope shouted for her, Mrs. Hope rushed to the window and saw the beast.", hints: "Immediately after... / rushed / beast" }
            ],
            why: [
                { q: "Why did the dog grow so big?", acceptable: "It grew big because the family was terrified.", standard: "The dog grew to a colossal size because the family's irrational fear fed the beast.", hints: "colossal size / irrational fear / fed the beast" },
                { q: "Why did Small go outside?", acceptable: "She went outside because she wasn't scared.", standard: "Since she possessed incredible courage, Small went outside to face the creature.", hints: "Since she possessed... / face the creature" },
                { q: "Why did the family hide?", acceptable: "They hid because they thought it was a monster.", standard: "They desperately hid because their exaggerated imagination made them believe the dog was a monster.", hints: "desperately / exaggerated imagination" },
                { q: "Why did the dog sit by the fire at the end?", acceptable: "Because it was now part of the family.", standard: "Because it was finally accepted, the tiny dog sat happily by the warm fire.", hints: "Because it was finally accepted / happily" },
                { q: "Why did the story happen in the snow?", acceptable: "To make it look mysterious.", standard: "The snow was used by the author to create a gloomy and isolated atmosphere.", hints: "to create a gloomy and isolated atmosphere" }
            ],
            which: [
                { q: "Which character showed the most courage?", acceptable: "Small showed the most courage.", standard: "Without a doubt, Small was the character who demonstrated the most courage.", hints: "Without a doubt / demonstrated" },
                { q: "Which word best describes the family's fear?", acceptable: "Their fear was irrational.", standard: "The family's uncontrollable fear can best be described as completely irrational.", hints: "uncontrollable / completely irrational" },
                { q: "Which animal was the dog compared to by Mr. Hope?", acceptable: "He compared it to a tiger.", standard: "In sheer panic, Mr. Hope compared the massive dog to a wild tiger.", hints: "In sheer panic / massive / wild" },
                { q: "Which animal was the dog compared to by Mrs. Hope?", acceptable: "She compared it to an elephant.", standard: "Overwhelmed by dread, Mrs. Hope compared the creature to a giant elephant.", hints: "Overwhelmed by dread / giant" },
                { q: "Which part of the house did the dog enter?", acceptable: "It entered through the cat flap.", standard: "Once it was tiny enough, the dog confidently entered the house through the small cat flap.", hints: "Once it was tiny enough / confidently" }
            ]
        };

        let currentQ = null;
        let lastQuestionText = ""; 

        function showQuestion(cat) {
            const list = questions[cat];
            let nextQ;
            do {
                nextQ = list[Math.floor(Math.random() * list.length)];
            } while (nextQ.q === lastQuestionText && list.length > 1);

            currentQ = nextQ;
            lastQuestionText = currentQ.q; 
            
            document.getElementById('menu').style.display = 'none';
            document.getElementById('question-display').style.display = 'block';
            document.getElementById('cat-label').innerText = cat;
            document.getElementById('question-content').innerText = currentQ.q;
            
            document.getElementById('answer-content').style.display = 'none';
            document.getElementById('action-area').style.display = 'block';
        }

        function showScaffold() {
            if (currentQ && currentQ.hints) {
                alert("💡 CHALLENGE CLUES:\nTo get the bonus point, try to use these fragments in your sentence:\n\n👉 " + currentQ.hints);
            }
        }

        function reveal(type) {
            const box = document.getElementById('answer-content');
            document.getElementById('action-area').style.display = 'none';
            box.style.display = 'block';
            
            if (type === 'standard') {
                box.innerHTML = "<strong>Standard Truth Challenge:</strong><br><br>" + currentQ.standard;
                box.style.backgroundColor = "#fff3e0";
                box.style.borderLeft = "5px solid #ff9800";
                box.style.color = "#e65100";
            } else {
                box.innerHTML = "<strong>Acceptable Truth:</strong><br><br>" + currentQ.acceptable;
                box.style.backgroundColor = "#e8f5e9";
                box.style.borderLeft = "5px solid #4caf50";
                box.style.color = "#2e7d32";
            }
        }

        function goBack() {
            document.getElementById('menu').style.display = 'grid';
            document.getElementById('question-display').style.display = 'none';
        }
    </script>
</body>
</html>
